[pytest]
# 测试脚本 pytest 配置文件
# 指定测试目录和测试文件匹配模式
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 添加项目根目录到 Python 路径
pythonpath = ..

# 测试发现时忽略的文件/目录
norecursedirs = .git __pycache__ .pytest_cache .mypy_cache node_modules web

# 默认命令行选项：详细输出，显示每个测试用例的打印信息
addopts = -v --tb=short --strict-markers

# 自定义标记定义
markers =
    api: Flask API 接口测试
    db: 数据库相关测试
    workflow: 工作流引擎测试
    llm: LLM 客户端测试
    utils: 工具类测试
    integration: 集成测试（可能依赖外部服务）
    unit: 纯单元测试（不依赖外部服务）
    slow: 耗时较长的测试
